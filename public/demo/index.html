const columns={aed:[['name','Tên thiết bị'],['type','Loại'],['address','Địa chỉ'],['manager','Đơn vị quản lý'],['status','Trạng thái']],products:[['name','Sản phẩm'],['category','Danh mục'],['price','Giá'],['stock','Tồn kho'],['status','Trạng thái']],posts:[['name','Tiêu đề'],['category','Chủ đề'],['author','Người phụ trách'],['status','Trạng thái']],orgs:[['name','Tổ chức'],['category','Loại'],['owner','Quản lý'],['members','Thành viên'],['status','Trạng thái']],users:[['name','Họ tên'],['email','Email demo'],['role','Vai trò'],['team','Đơn vị'],['status','Trạng thái']],orders:[['name','Đơn hàng'],['customer','Khách hàng'],['items','Nội dung'],['total','Tổng tiền'],['status','Trạng thái']],facilities:[['name','Cơ sở'],['type','Loại cơ sở'],['address','Địa chỉ'],['phone','Điện thoại'],['status','Trạng thái']]};
let data=loadData(),current='aed',role='admin',editId=null,uploadedImage='';
function loadData(){try{return JSON.parse(localStorage.getItem('gm-demo-data-v1'))||structuredClone(seed)}catch{return structuredClone(seed)}}
function save(){localStorage.setItem('gm-demo-data-v1',JSON.stringify(data))}
function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function canEdit(){return role==='admin'||role==='manager'||role==='staff'}
function canDelete(){return role==='admin'||role==='manager'}
function statusLabel(s){return ({active:'Đang hoạt động',pending:'Đang xử lý',inactive:'Tạm ngưng'})[s]||s}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.querySelector('#nav').innerHTML=Object.keys(meta).map(k=>'<button data-tab="'+k+'" class="'+(current===k?'active':'')+'">'+meta[k][0]+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render()});document.querySelector('#pageTitle').textContent=meta[current][0];document.querySelector('#pageDesc').textContent=meta[current][1];document.querySelector('#add').style.display=canEdit()?'':'none';document.querySelector('#stats').innerHTML=[['Danh mục',Object.keys(meta).length],['Bản ghi hiện tại',data[current].length],['Đang hoạt động',data[current].filter(x=>x.status==='active').length],['Vai trò',role.toUpperCase()]].map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');document.querySelector('#thead').innerHTML='<tr><th>Mục</th>'+columns[current].map(c=>'<th>'+c[1]+'</th>').join('')+'<th>Thao tác</th></tr>';let q=document.querySelector('#search').value.toLocaleLowerCase('vi'),f=document.querySelector('#filter').value,sort=document.querySelector('#sort').value;let rows=data[current].filter(r=>(!q||Object.values(r).join(' ').toLocaleLowerCase('vi').includes(q))&&(f==='all'||r.status===f));if(sort==='name')rows.sort((a,b)=>(a.name||'').localeCompare(b.name||'','vi'));if(sort==='newest')rows.reverse();document.querySelector('#tbody').innerHTML=rows.map(r=>'<tr><td><div class="item"><img class="thumb" src="'+esc(r.image||IMG[0])+'" alt="" onerror="this.src=\'/assets/products/first-aid-family-kit.svg\'"><div><b>'+esc(r.name)+'</b><div class="muted">'+esc(r.id)+'</div></div></div></td>'+columns[current].map(c=>'<td>'+(c[0]==='status'?'<span class="pill '+(r.status==='pending'?'warn':'')+'">'+esc(statusLabel(r.status))+'</span>':esc(r[c[0]]))+'</td>').join('')+'<td><div class="rowactions"><button class="soft" data-edit="'+esc(r.id)+'" '+(!canEdit()?'disabled':'')+'>Sửa</button><button class="danger" data-del="'+esc(r.id)+'" '+(!canDelete()?'disabled':'')+'>Xóa</button></div></td></tr>').join('')||'<tr><td colspan="'+(columns[current].length+2)+'" class="empty">Không có bản ghi phù hợp.</td></tr>';document.querySelector('#hint').textContent='Dữ liệu lưu riêng trong trình duyệt này. '+(role==='viewer'?'Vai trò Viewer chỉ có quyền xem.':'Thay đổi không gửi sang Supabase hoặc hệ thống thanh toán thật.');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeRow(b.dataset.del))}
function openForm(id){if(!canEdit())return;editId=id||null;let r=id?data[current].find(x=>x.id===id):{status:'active',image:IMG[0]};document.querySelector('#formTitle').textContent=id?'Cập nhật bản ghi':'Thêm bản ghi';let fields=[['name','Tên'],...columns[current].filter(c=>!['name','status'].includes(c[0])).map(c=>[c[0],c[1]]),['status','Trạng thái']];document.querySelector('#fields').innerHTML=fields.map(([k,label])=>'<label class="field">'+label+(k==='status'?'<select name="status"><option value="active">Đang hoạt động</option><option value="pending">Đang xử lý</option><option value="inactive">Tạm ngưng</option></select>':'<input name="'+k+'" value="'+esc(r[k]||'')+'" required>')+'</label>').join('')+'<label class="field full">Ảnh minh họa (tùy chọn)<input type="file" name="imageFile" accept="image/*" capture="environment"><img id="imagePreview" class="preview" src="'+esc(r.image||IMG[0])+'" alt="Xem trước ảnh"></label>';document.querySelector('#editForm').elements.status.value=r.status||'active';uploadedImage=r.image||IMG[0];document.querySelector('[name=imageFile]').onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024){notify('Ảnh tối đa 2 MB');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{uploadedImage=reader.result;document.querySelector('#imagePreview').src=uploadedImage};reader.readAsDataURL(file)};document.querySelector('#editModal').classList.add('open')}
function removeRow(id){if(!canDelete())return;if(!confirm('Xóa bản ghi '+id+' khỏi dữ liệu demo?'))return;data[current]=data[current].filter(x=>x.id!==id);save();render();notify('Đã xóa bản ghi demo')}
document.querySelector('#editForm').onsubmit=e=>{e.preventDefault();if(!canEdit())return;const form=new FormData(e.target),old=editId?data[current].find(x=>x.id===editId):null,record={...(old||{}),id:editId||current.toUpperCase().slice(0,3)+'-'+String(Date.now()).slice(-6),image:uploadedImage,status:form.get('status')||'active'};for(const [k,v] of form.entries())if(k!=='imageFile')record[k]=v;if(current==='users'&&!record.role)record.role='Member';if(current==='products'&&!record.price)record.price='0 ₫';if(current==='products'&&!record.stock)record.stock='0';if(editId)data[current]=data[current].map(x=>x.id===editId?record:x);else data[current].unshift(record);save();document.querySelector('#editModal').classList.remove('open');render();notify(editId?'Đã cập nhật bản ghi demo':'Đã thêm bản ghi demo')};
document.querySelector('#cancel').onclick=()=>document.querySelector('#editModal').classList.remove('open');document.querySelector('#add').onclick=()=>openForm();['search','filter','sort'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='search'?'input':'change',render));document.querySelector('#reset').onclick=()=>{if(confirm('Khôi phục toàn bộ dữ liệu demo ban đầu?')){data=structuredClone(seed);save();render();notify('Đã khôi phục dữ liệu gốc')}};document.querySelector('#switchRole').onclick=()=>document.querySelector('#login').style.display='grid';document.querySelector('#enter').onclick=()=>{role=document.querySelector('input[name=role]:checked').value;document.querySelector('#login').style.display='none';render();notify('Đã vào demo với vai trò '+role)};render();
</script></body></html>
